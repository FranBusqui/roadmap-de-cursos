# Entorno de desarrollo: postgres + backend + frontend (TRD §3.3).
# Sin healthchecks ni imágenes optimizadas a propósito: llegan en los tickets de clase (T7–T10).
services:
  postgres:
    image: postgres:18.6
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql # PostgreSQL 18 espera el volumen en este directorio
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    env_file: .env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules # conserva los node_modules de la imagen (los de Windows no sirven en Linux)
    ports:
      - "5173:5173"

volumes:
  pgdata:
