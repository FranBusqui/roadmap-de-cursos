[project]
name = "roadmap-cursos-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.158.2",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.7",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
